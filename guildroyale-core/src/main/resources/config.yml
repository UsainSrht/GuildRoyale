# ─────────────────────────────────────────────────────────────────
#  GuildRoyale — config.yml
# ─────────────────────────────────────────────────────────────────

# Storage backend: JSON | SQLITE | MYSQL
storage:
  type: JSON

  # Used only when type is SQLITE
  sqlite:
    file: guildroyale.db

  # Used only when type is MYSQL
  mysql:
    host: localhost
    port: 3306
    database: guildroyale
    username: root
    password: password
    pool-size: 10

# ── Guild creation ───────────────────────────────────────────────
# Each requirement can be enabled independently. When enabled, all
# enabled requirements must be satisfied (AND).
creation:
  permission:
    enabled: true
    node: guildroyale.create
  money:
    enabled: true
    cost: 500.0
  items:
    enabled: false
    requirements:
      - material: DIAMOND
        amount: 10

# ── Shortname change cost ────────────────────────────────────────
shortname-change-cost: 100.0

# ── XP / level progression ──────────────────────────────────────
xp:
  # XP required for level n = base * (multiplier ^ (n - 1))
  base: 1000
  multiplier: 1.5
  # Maximum guild level. Set to 0 (or negative) for unlimited.
  level-cap: 10
  # Optional custom perks/rewards displayed per level
  # perks:
  #   2:
  #     - "<gray>Access to <yellow>Guild Bank"
  #     - "<gray>Custom guild <yellow>Shortname"

# ── Feature unlock levels & level perks ───────────────────────────
features:
  # Maximum members per guild level: base + (level - 1) * per-level (up to max)
  members:
    base: 10
    per-level: 2
    max: 50
  # Maximum custom roles per guild level: base + (level - 1) * per-level (up to max)
  roles:
    base: 4
    per-level: 1
    max: 15
  icon:
    unlock-level: 1
  shortname:
    unlock-level: 2
  badge:
    unlock-level: 5
  storage:
    unlock-level: 1
    slots-per-level: 9
    max-slots: 135
  bank:
    unlock-level: 2

# ── Guild Missions ───────────────────────────────────────────────
missions:
  enabled: true
  # Duration of an active mission in seconds (default: 7200 = 2 hours)
  duration: 7200

  # Cooldown between missions: DELAY | DAILY | WEEKLY
  cooldown:
    type: DAILY
    # Used when type is DELAY (in seconds)
    delay-seconds: 86400
    # Used when type is DAILY (format HH:mm, e.g. "12:00" = 12pm reset)
    daily-reset-time: "12:00"
    # Used when type is WEEKLY (reset day and time)
    weekly-reset-day: "MONDAY"
    weekly-reset-time: "00:00"
    # Timezone used for daily/weekly calculations (e.g. UTC, America/New_York)
    timezone: "UTC"

  # Requirements to start a mission
  requirements:
    permission:
      enabled: false
      node: "guildroyale.mission.start"
    money:
      enabled: true
      cost: 1000.0
      # Where money is deducted from: "BANK" (guild bank) or "PLAYER" (starter's account)
      take-from: "BANK"
    items:
      enabled: false
      requirements:
        - material: DIAMOND
          amount: 5

  # Rewards distributed to the guild upon successful mission completion
  rewards:
    xp: 5000
    # Deposited into the guild bank
    money: 2500.0

  # Penalties applied to the guild if time expires before tasks are complete
  penalties:
    # Deducted from guild XP (can go negative; level does not decrease)
    xp: 2500
    # Withdrawn from the guild bank
    money: 1000.0

  # Adventure Bossbar displayed to online guild members during an active mission
  bossbar:
    enabled: true
    title: "<gradient:#55c57a:#a8e6c1><bold>Guild Mission</bold></gradient> <dark_gray>•</dark_gray> <green><percent>%</green> <dark_gray>(<white><completed_tasks>/<total_tasks> tasks<dark_gray>)</dark_gray> <dark_gray>•</dark_gray> <yellow><time_remaining></yellow>"
    color: GREEN
    overlay: PROGRESS

  # List of tasks to complete collectively
  tasks:
    break_stones:
      type: BLOCK_BREAK
      display-name: "<gray><bold>Break Stones</bold></gray>"
      icon: STONE
      target: 500000
      blocks:
        - STONE
        - COBBLESTONE
        - DEEPSLATE
        - COBBLED_DEEPSLATE
    trade_villagers:
      type: VILLAGER_TRADE
      display-name: "<gold><bold>Villager Trades</bold></gold>"
      icon: VILLAGER_SPAWN_EGG
      target: 100000
    trade_emeralds:
      type: VILLAGER_TRADE_ITEM
      display-name: "<green><bold>Trade Emeralds</bold></green>"
      icon: EMERALD
      target: 50000
      item: EMERALD
      mode: ANY # GIVEN, RECEIVED, or ANY
    kill_zombies:
      type: KILL_ENTITY
      display-name: "<red><bold>Slay Zombies</bold></red>"
      icon: ZOMBIE_HEAD
      target: 10000
      entities:
        - ZOMBIE
        - ZOMBIE_VILLAGER
        - HUSK
        - DROWNED
    craft_pistons:
      type: CRAFT_ITEM
      display-name: "<yellow><bold>Craft Pistons</bold></yellow>"
      icon: PISTON
      target: 5000
      items:
        - PISTON
        - STICKY_PISTON
    upgrade_claims:
      type: CUSTOM
      display-name: "<aqua><bold>Upgrade Claims</bold></aqua>"
      icon: BEACON
      target: 5
      custom_id: upgrade_claim

# ── Badges (MiniMessage display text, symbol & custom icon) ───────
# grantable: true = grant-only via /guildadmin badge grant (cannot be bought)
# grantable: false = buyable with economy funds if cost > 0
# level = minimum guild level required to equip/buy
badges:
  pioneer:
    display: "<gold>Pioneer</gold>"
    symbol: "<gold>✦</gold>"
    icon:
      material: NETHER_STAR
    cost: 1000.0
    grantable: false
    level: 1
  veteran:
    display: "<aqua>Veteran</aqua>"
    symbol: "<aqua>★</aqua>"
    icon:
      material: GOLDEN_HELMET
    cost: 0
    grantable: true
    level: 1

# ── Leaderboard ──────────────────────────────────────────────────
leaderboard:
  # How many guilds to show per page in the GUI
  page-size: 10
  # How often (in seconds) to refresh the cached leaderboard
  cache-refresh-seconds: 60

# ── Invite expiry ────────────────────────────────────────────────
invite:
  # Seconds until a pending invite expires
  expire-seconds: 120

# ── Commands ─────────────────────────────────────────────────────
# IMPORTANT: command names and aliases are registered with Brigadier
# at server start-up. Any changes here require a full server restart.
#
# Permission nodes are hardcoded and do NOT change when you rename
# a command. Assign them in your permissions plugin as usual.
commands:
  guild:
    # The primary command name (default: /guild)
    name: guild
    # Additional aliases (Brigadier registers these on startup)
    aliases:
      - g
    # Subcommand labels — string form or { name, aliases, children }
    # Permission nodes never change when you rename labels.
    subcommands:
      create:
        name: create
        aliases: [c, new]
      disband: disband
      info: info
      invite: invite
      join: join
      leave: leave
      kick: kick
      role:
        name: role
        aliases: [roles]
        children:
          create: create
          delete: delete
          rename: rename
          setpermission:
            name: setpermission
            aliases: [perm, permission]
      icon: icon
      shortname:
        name: shortname
        aliases: [tag, sn]
      leaderboard:
        name: leaderboard
        aliases: [lb, top]
      leader: leader
      menu:
        name: menu
        aliases: [gui, hub]
      badge:
        name: badge
        aliases: [badges]
        children:
          list: list
          buy: buy
          equip: equip
      storage:
        name: storage
        aliases: [chest]
      bank:
        name: bank
        aliases: [b]
        children:
          balance:
            name: balance
            aliases: [bal]
          deposit:
            name: deposit
            aliases: [dep]
          withdraw:
            name: withdraw
            aliases: [with]
      mission:
        name: mission
        aliases: [missions, quest, quests, m]
      help:
        name: help
        aliases: [?]

  admin:
    # The primary admin command name (default: /guildadmin)
    name: guildadmin
    aliases:
      - ga
    subcommands:
      reload: reload
      addxp: addxp
      setlevel: setlevel
      delete: delete
      badge:
        name: badge
        children:
          grant: grant
          revoke: revoke
      mission:
        name: mission
        children:
          start: start
          stop: stop
          complete: complete
          addprogress: addprogress
          removeprogress: removeprogress
          resetcooldown: resetcooldown

# ── Default roles ────────────────────────────────────────────────
# Configure default role names, indexes, and colors for newly created guilds
default-roles:
  - name: Leader
    index: 0
    color: YELLOW
  - name: Co-Leader
    index: 1
    color: ORANGE
  - name: Helper
    index: 2
    color: LIME
  - name: Member
    index: 3
    color: GRAY

# ── Guild Permissions (customizable display names, icons & default role index) ──
# index: default minimum role index required for this permission (roles with role index <= permission index will have this permission by default)
permissions:
  member_management:
    name: "Member Management"
    icon: PLAYER_HEAD
    index: 1
  role_management:
    name: "Role Management"
    icon: WRITABLE_BOOK
    index: 0
  guild_settings:
    name: "Guild Settings"
    icon: COMPARATOR
    index: 1
  icon_change:
    name: "Icon Change"
    icon: ITEM_FRAME
    index: 1
  shortname_change:
    name: "Shortname Change"
    icon: NAME_TAG
    index: 1
  disbandment:
    name: "Disbandment"
    icon: BARRIER
    index: 0
  invite:
    name: "Invite Members"
    icon: PAPER
    index: 2
  kick:
    name: "Kick Members"
    icon: IRON_BOOTS
    index: 1
  badge_manage:
    name: "Badge Management"
    icon: NETHER_STAR
    index: 1
  storage_access:
    name: "Storage Access"
    icon: CHEST
    index: 2
  bank_view:
    name: "Bank View"
    icon: SPYGLASS
    index: 2
  bank_deposit:
    name: "Bank Deposit"
    icon: GOLD_NUGGET
    index: 2
  bank_withdraw:
    name: "Bank Withdraw"
    icon: GOLD_INGOT
    index: 1
  mission_start:
    name: "Mission Start"
    icon: TARGET
    index: 1

