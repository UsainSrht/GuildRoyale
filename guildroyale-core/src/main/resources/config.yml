# ─────────────────────────────────────────────────────────────────
#  GuildRoyale — config.yml
# ─────────────────────────────────────────────────────────────────

# Storage backend: JSON | SQLITE | MYSQL
storage:
  type: JSON

  # Used only when type is SQLITE
  sqlite:
    file: guildroyale.db

  # Used only when type is MYSQL
  mysql:
    host: localhost
    port: 3306
    database: guildroyale
    username: root
    password: password
    pool-size: 10

# ── Guild creation ───────────────────────────────────────────────
# Each requirement can be enabled independently. When enabled, all
# enabled requirements must be satisfied (AND).
creation:
  permission:
    enabled: true
    node: guildroyale.create
  money:
    enabled: true
    cost: 500.0
  items:
    enabled: false
    requirements:
      - material: DIAMOND
        amount: 10

# ── Shortname change cost ────────────────────────────────────────
shortname-change-cost: 100.0

# ── XP / level progression ──────────────────────────────────────
xp:
  # XP required for level n = base * (multiplier ^ (n - 1))
  base: 1000
  multiplier: 1.5
  # Maximum guild level. Set to 0 (or negative) for unlimited.
  level-cap: 10

# ── Feature unlock levels ────────────────────────────────────────
features:
  shortname:
    unlock-level: 2
  badge:
    unlock-level: 5
  storage:
    unlock-level: 1
    slots-per-level: 9
    max-slots: 135
  bank:
    unlock-level: 2

# ── Badges (MiniMessage display text, symbol & custom icon) ───────
# grantable: true = grant-only via /guildadmin badge grant (cannot be bought)
# grantable: false = buyable with economy funds if cost > 0
# level = minimum guild level required to equip/buy
badges:
  pioneer:
    display: "<gold>Pioneer</gold>"
    symbol: "<gold>✦</gold>"
    icon:
      material: NETHER_STAR
    cost: 1000.0
    grantable: false
    level: 1
  veteran:
    display: "<aqua>Veteran</aqua>"
    symbol: "<aqua>★</aqua>"
    icon:
      material: GOLDEN_HELMET
    cost: 0
    grantable: true
    level: 1

# ── Leaderboard ──────────────────────────────────────────────────
leaderboard:
  # How many guilds to show per page in the GUI
  page-size: 10
  # How often (in seconds) to refresh the cached leaderboard
  cache-refresh-seconds: 60

# ── Invite expiry ────────────────────────────────────────────────
invite:
  # Seconds until a pending invite expires
  expire-seconds: 120

# ── Commands ─────────────────────────────────────────────────────
# IMPORTANT: command names and aliases are registered with Brigadier
# at server start-up. Any changes here require a full server restart.
#
# Permission nodes are hardcoded and do NOT change when you rename
# a command. Assign them in your permissions plugin as usual.
commands:
  guild:
    # The primary command name (default: /guild)
    name: guild
    # Additional aliases (Brigadier registers these on startup)
    aliases:
      - g
    # Subcommand labels — string form or { name, aliases, children }
    # Permission nodes never change when you rename labels.
    subcommands:
      create:
        name: create
        aliases: [c, new]
      disband: disband
      info: info
      invite: invite
      join: join
      leave: leave
      kick: kick
      role:
        name: role
        aliases: [roles]
        children:
          create: create
          delete: delete
          rename: rename
          setpermission:
            name: setpermission
            aliases: [perm, permission]
      icon: icon
      shortname:
        name: shortname
        aliases: [tag, sn]
      leaderboard:
        name: leaderboard
        aliases: [lb, top]
      leader: leader
      menu:
        name: menu
        aliases: [gui, hub]
      badge:
        name: badge
        aliases: [badges]
        children:
          list: list
          buy: buy
          equip: equip
      storage:
        name: storage
        aliases: [chest]
      bank:
        name: bank
        aliases: [b]
        children:
          balance:
            name: balance
            aliases: [bal]
          deposit:
            name: deposit
            aliases: [dep]
          withdraw:
            name: withdraw
            aliases: [with]
      help:
        name: help
        aliases: [?]

  admin:
    # The primary admin command name (default: /guildadmin)
    name: guildadmin
    aliases:
      - ga
    subcommands:
      reload: reload
      addxp: addxp
      setlevel: setlevel
      delete: delete
      badge:
        name: badge
        children:
          grant: grant
          revoke: revoke

# ── Default roles ────────────────────────────────────────────────
# Index 0 is always Leader (full permissions, cannot be deleted or customised here)
default-roles:
  - name: Co-Leader
    index: 1
    permissions:
      - MEMBER_MANAGEMENT
      - INVITE
      - KICK
      - GUILD_SETTINGS
      - ICON_CHANGE
      - SHORTNAME_CHANGE
      - BADGE_MANAGE
      - STORAGE_ACCESS
      - BANK_VIEW
      - BANK_DEPOSIT
      - BANK_WITHDRAW
  - name: Helper
    index: 2
    permissions:
      - INVITE
      - STORAGE_ACCESS
      - BANK_VIEW
      - BANK_DEPOSIT
  - name: Member
    index: 3
    permissions: []

# ── Guild Permissions (customizable display names & icons) ─────────
permissions:
  member_management:
    name: "Member Management"
    icon: PLAYER_HEAD
  role_management:
    name: "Role Management"
    icon: WRITABLE_BOOK
  guild_settings:
    name: "Guild Settings"
    icon: COMPARATOR
  icon_change:
    name: "Icon Change"
    icon: ITEM_FRAME
  shortname_change:
    name: "Shortname Change"
    icon: NAME_TAG
  disbandment:
    name: "Disbandment"
    icon: BARRIER
  invite:
    name: "Invite Members"
    icon: PAPER
  kick:
    name: "Kick Members"
    icon: IRON_BOOTS
  badge_manage:
    name: "Badge Management"
    icon: NETHER_STAR
  storage_access:
    name: "Storage Access"
    icon: CHEST
  bank_view:
    name: "Bank View"
    icon: SPYGLASS
  bank_deposit:
    name: "Bank Deposit"
    icon: GOLD_NUGGET
  bank_withdraw:
    name: "Bank Withdraw"
    icon: GOLD_INGOT

# ── Role Colors (customizable display names) ────────────────────
role-colors:
  white: "<white>White"
  orange: "<gold>Orange"
  magenta: "<light_purple>Magenta"
  light_blue: "<aqua>Light Blue"
  yellow: "<yellow>Yellow"
  lime: "<green>Lime"
  pink: "<#FF69B4>Pink"
  gray: "<gray>Gray"
  light_gray: "<gray>Light Gray"
  cyan: "<dark_aqua>Cyan"
  purple: "<dark_purple>Purple"
  blue: "<blue>Blue"
  brown: "<#8B4513>Brown"
  green: "<dark_green>Green"
  red: "<red>Red"
  black: "<dark_gray>Black"

