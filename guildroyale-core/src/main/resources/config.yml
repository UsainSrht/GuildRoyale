# ─────────────────────────────────────────────────────────────────
#  GuildRoyale — config.yml
# ─────────────────────────────────────────────────────────────────

# Storage backend: JSON | SQLITE | MYSQL
storage:
  type: JSON

  # Used only when type is SQLITE
  sqlite:
    file: guildroyale.db

  # Used only when type is MYSQL
  mysql:
    host: localhost
    port: 3306
    database: guildroyale
    username: root
    password: password
    pool-size: 10

# ── Guild creation ───────────────────────────────────────────────
# Each requirement can be enabled independently. When enabled, all
# enabled requirements must be satisfied (AND).
creation:
  permission:
    enabled: true
    node: guildroyale.create
  money:
    enabled: true
    cost: 500.0
  items:
    enabled: false
    requirements:
      - material: DIAMOND
        amount: 10

# ── Shortname change cost ────────────────────────────────────────
shortname-change-cost: 100.0

# ── XP / level progression ──────────────────────────────────────
xp:
  # XP required for level n = base * (multiplier ^ (n - 1))
  base: 1000
  multiplier: 1.5
  # Maximum guild level. Set to 0 (or negative) for unlimited.
  level-cap: 10

# ── Feature unlock levels ────────────────────────────────────────
features:
  shortname:
    unlock-level: 2
  badge:
    unlock-level: 5
  storage:
    unlock-level: 1
    slots-per-level: 9
    max-slots: 54
  bank:
    unlock-level: 2

# ── Badges (MiniMessage display text) ────────────────────────────
# cost > 0 = buyable with player economy; cost 0 = grant-only
# grantable = can be given via /guildadmin badge grant
badges:
  pioneer:
    display: "<gold>✦ Pioneer</gold>"
    cost: 1000.0
    grantable: true
  veteran:
    display: "<aqua>Veteran</aqua>"
    cost: 0
    grantable: true

# ── Leaderboard ──────────────────────────────────────────────────
leaderboard:
  # How many guilds to show per page in the GUI
  page-size: 10
  # How often (in seconds) to refresh the cached leaderboard
  cache-refresh-seconds: 60

# ── Invite expiry ────────────────────────────────────────────────
invite:
  # Seconds until a pending invite expires
  expire-seconds: 120

# ── Commands ─────────────────────────────────────────────────────
# IMPORTANT: command names and aliases are registered with Brigadier
# at server start-up. Any changes here require a full server restart.
#
# Permission nodes are hardcoded and do NOT change when you rename
# a command. Assign them in your permissions plugin as usual.
commands:
  guild:
    # The primary command name (default: /guild)
    name: guild
    # Additional aliases (Brigadier registers these on startup)
    aliases:
      - g
    # Subcommand labels — string form or { name, aliases, children }
    # Permission nodes never change when you rename labels.
    subcommands:
      create:
        name: create
        aliases: [c, new]
      disband: disband
      info: info
      invite: invite
      join: join
      leave: leave
      kick: kick
      role:
        name: role
        aliases: [roles]
        children:
          create: create
          delete: delete
          rename: rename
          setpermission:
            name: setpermission
            aliases: [perm, permission]
      icon: icon
      shortname:
        name: shortname
        aliases: [tag, sn]
      leaderboard:
        name: leaderboard
        aliases: [lb, top]
      leader: leader
      menu:
        name: menu
        aliases: [gui, hub]
      badge:
        name: badge
        aliases: [badges]
        children:
          list: list
          buy: buy
          equip: equip
      storage:
        name: storage
        aliases: [chest]
      bank:
        name: bank
        aliases: [b]
        children:
          balance:
            name: balance
            aliases: [bal]
          deposit:
            name: deposit
            aliases: [dep]
          withdraw:
            name: withdraw
            aliases: [with]
      help:
        name: help
        aliases: [?]

  admin:
    # The primary admin command name (default: /guildadmin)
    name: guildadmin
    aliases:
      - ga
    subcommands:
      reload: reload
      addxp: addxp
      setlevel: setlevel
      delete: delete
      badge:
        name: badge
        children:
          grant: grant
          revoke: revoke

# ── Default roles ────────────────────────────────────────────────
# Index 0 is always Leader (full permissions, cannot be deleted or customised here)
default-roles:
  - name: Co-Leader
    index: 1
    permissions:
      - MEMBER_MANAGEMENT
      - INVITE
      - KICK
      - GUILD_SETTINGS
      - ICON_CHANGE
      - SHORTNAME_CHANGE
      - BADGE_MANAGE
      - STORAGE_ACCESS
      - BANK_VIEW
      - BANK_DEPOSIT
      - BANK_WITHDRAW
  - name: Helper
    index: 2
    permissions:
      - INVITE
      - STORAGE_ACCESS
      - BANK_VIEW
      - BANK_DEPOSIT
  - name: Member
    index: 3
    permissions: []
