# ─────────────────────────────────────────────────────────────────
#  GuildRoyale — guis.yml
#  Titles/lores use MiniMessage. Placeholders: <guild>, <page>, <max_page>, …
#  Items are parsed by YamlItem (ItemAPI).
# ─────────────────────────────────────────────────────────────────

hub:
  size: 27
  title: "<gradient:#f0c14b:#ffe08a><bold>GuildRoyale</bold></gradient>"
  slots:
    info: 11
    create: 15
    leaderboard: 13
  requirements:
    separator: "<dark_gray>─────────────────"
    header: "<yellow>Requirements:"
    permission-ok: "<green>✔ <gray>Permission"
    permission-fail: "<red>✘ <gray>Permission <dark_gray>(<node>)"
    cost-ok: "<green>✔ <gray>Cost: <white><cost>"
    cost-fail: "<red>✘ <gray>Cost: <white><cost>"
    item-ok-prefix: "<green>✔ "
    item-fail-prefix: "<red>✘ "
    none: "<gray>None — free to create!"

dialogs:
  create:
    title: "<gold><bold>Create a Guild"
    body: "<gray>Choose a <white>name</white> (3–32 chars) and a <white>shortname</white> (2–6 alphanumeric)."
    name-label: "<yellow>Guild Name"
    shortname-label: "<yellow>Shortname"
    submit: "<green>Create Guild"
  shortname:
    title: "<gold>Change Shortname"
    body: "<gray>Enter a new shortname <dark_gray>(2–6 alphanumeric)."
    input-label: "<yellow>New Shortname"
    submit: "<green>Change"
  role-name:
    title: "<gold>Role Name"
    body: "<gray><prompt>"
    input-label: "<yellow>Role Name"
    submit: "<green>Confirm"

main:
  size: 27
  title: "<gold>Guild Menu <dark_gray>— <yellow><guild>"
  slots:
    icon: 4
    info: 10
    members: 11
    roles: 12
    leaderboard: 13
    storage: 14
    bank: 15
    settings: 16
    disband: 22

info:
  size: 27
  title: "<gold>Guild Info <dark_gray>— <yellow><guild>"
  slots:
    info: 13
    back: 22
  badge-line: "<gray>Badge: <badge>"

members:
  size: 54
  title: "<gold>Members <dark_gray>— <yellow><guild> <dark_gray>(Page <page>/<max_page>)"
  page-size: 36
  slots:
    previous: 45
    next: 53
    close: 49

member-action:
  size: 27
  title: "<gold>Member: <yellow><player>"
  slots:
    head: 4
    kick: 11
    promote: 13
    demote: 15
    back: 22

roles:
  size: 54
  title: "<gold>Roles <dark_gray>— <yellow><guild>"
  content-slots: 45
  slots:
    create: 49
    back: 45

role-editor:
  size: 54
  title: "<gold>Edit Role: <yellow><role>"
  slots:
    info: 4
    permissions-start: 18
    set-icon: 46
    delete: 52
    back: 45
  permission-enabled: "<green>✔ <permission>"
  permission-disabled: "<red>✗ <permission>"
  materials:
    permission-enabled: lime_dye
    permission-disabled: red_dye

leaderboard:
  size: 54
  title: "<gold>Guild Leaderboard <dark_gray>— Page <page>/<max_page>"
  page-size: 36
  slots:
    previous: 45
    next: 53
    close: 49

storage:
  title: "<gold>Guild Storage <dark_gray>— <yellow><guild>"

icon-selection:
  size: 54
  title: "<aqua>Select an icon <dark_gray>— click any item"
  content-slots: 36
  instruction-slot: 49
  instruction-row-start: 45
  instruction-row-end: 54

items:
  # ── Hub (not in a guild) ───────────────────────────────────────
  hub-info-book:
    material: book
    name: "<gold><bold>How Guilds Work"
    lore:
      - "<gray>Guilds let you team up, share"
      - "<gray>storage & bank, earn XP, and"
      - "<gray>climb the leaderboard."
      - ""
      - "<yellow>Getting started"
      - "<white>1. <gray>Meet the requirements"
      - "<white>2. <gray>Click <green>Create a Guild"
      - "<white>3. <gray>Pick a name & shortname"
      - "<white>4. <gray>Invite friends with"
      - "   <yellow>/guild invite <player>"
      - ""
      - "<dark_gray>Hover the create button for"
      - "<dark_gray>live requirement status."

  create-ready:
    material: lime_concrete
    name: "<green><bold>Create a Guild"
    lore:
      - "<gray>You meet the requirements!"
      - "<yellow>Click <gray>to open the creation dialog."

  create-already-in-guild:
    material: barrier
    name: "<red><bold>Already in a Guild"
    lore:
      - "<gray>Leave or disband your current"
      - "<gray>guild before creating another."

  create-no-permission:
    material: red_concrete
    name: "<red><bold>Cannot Create"
    lore:
      - "<gray>You lack permission to create"
      - "<gray>a guild on this server."

  create-insufficient-funds:
    material: red_concrete
    name: "<red><bold>Not Enough Money"
    lore:
      - "<gray>Earn more money, then try again."

  create-missing-items:
    material: red_concrete
    name: "<red><bold>Missing Items"
    lore:
      - "<gray>Gather the required items,"
      - "<gray>then try again."

  hub-leaderboard:
    material: golden_helmet
    name: "<gold>Leaderboard"
    lore:
      - "<gray>See the top guilds"
      - "<gray>on this server."

  # ── Main menu (in a guild) ─────────────────────────────────────
  main-info:
    material: paper
    name: "<aqua>Guild Info"
    lore:
      - "<gray>View level, XP, members,"
      - "<gray>and other guild details."

  main-members:
    material: player_head
    name: "<green>Members"
    lore:
      - "<gray>View and manage members."

  main-roles:
    material: writable_book
    name: "<yellow>Roles"
    lore:
      - "<gray>Manage roles & permissions."

  main-leaderboard:
    material: golden_helmet
    name: "<gold>Leaderboard"
    lore:
      - "<gray>Global guild rankings."

  main-storage:
    material: chest
    name: "<gold>Storage"
    lore:
      - "<gray>Open the shared guild chest."

  main-bank:
    material: gold_ingot
    name: "<yellow>Bank"
    lore:
      - "<gray>Check balance or manage funds"
      - "<gray>via <white>/guild bank"

  main-settings:
    material: comparator
    name: "<gray>Settings"
    lore:
      - "<gray>Change shortname, icon,"
      - "<gray>and other guild options."

  main-disband:
    material: barrier
    name: "<red>Disband"
    lore:
      - "<red>Permanently delete this guild."
      - "<dark_gray>Leaders only — use"
      - "<yellow>/guild disband"

  # ── Shared nav ─────────────────────────────────────────────────
  gui-filler:
    material: gray_stained_glass_pane
    name: "<reset>"
    lore: []

  gui-back:
    material: arrow
    name: "<gray>Back"
    lore:
      - "<dark_gray>Return to the previous menu."

  gui-previous:
    material: arrow
    name: "<aqua>« Previous Page"
    lore: []

  gui-next:
    material: arrow
    name: "<aqua>Next Page »"
    lore: []

  gui-close:
    material: barrier
    name: "<red>Close"
    lore: []

  # ── Info ───────────────────────────────────────────────────────
  info-book:
    material: book
    name: "<gold><guild>"
    lore:
      - "<gray>Shortname: [<shortname>]"
      - "<gray>Level: <level>"
      - "<gray>XP: <xp>"
      - "<gray>Members: <members>"
      - "<gray>Leader: <leader>"
      - "<gray>Founded: <founded>"

  # ── Members ────────────────────────────────────────────────────
  members-entry:
    material: player_head
    name: "<yellow><player>"
    lore:
      - "<gray>Role: <white><role>"
      - "<gray>Contribution: <white><contribution> XP"
      - "<yellow>Click to manage"

  # ── Member action ──────────────────────────────────────────────
  member-action-head:
    material: player_head
    name: "<yellow><player>"
    lore:
      - "<gray>Role: <white><role>"
      - "<gray>Contribution: <white><contribution> XP"

  member-action-kick:
    material: barrier
    name: "<red>Kick"
    lore:
      - "<gray>Remove this member from the guild"

  member-action-promote:
    material: arrow
    name: "<green>Promote"
    lore:
      - "<gray>Move to a higher role"

  member-action-demote:
    material: arrow
    name: "<yellow>Demote"
    lore:
      - "<gray>Move to a lower role"

  # ── Roles ──────────────────────────────────────────────────────
  roles-entry:
    material: name_tag
    name: "<gold><role>"
    lore:
      - "<gray>Index: <white><index>"
      - "<gray>Permissions: <white><permissions>"
      - "<yellow>Click to edit"

  roles-create:
    material: lime_dye
    name: "<green>+ Create New Role"
    lore: []

  # ── Role editor ────────────────────────────────────────────────
  role-editor-info:
    material: name_tag
    name: "<gold>Role: <role>"
    lore: []

  role-editor-set-icon:
    material: painting
    name: "<aqua>Set Icon"
    lore:
      - "<gray>Hold an item and click to set as role icon"

  role-editor-delete:
    material: barrier
    name: "<red>Delete Role"
    lore:
      - "<red>Remove this role. Members will be reassigned."

  # ── Leaderboard ────────────────────────────────────────────────
  leaderboard-entry:
    material: golden_helmet
    name: "<gold>#<rank> <guild>"
    lore:
      - "<gray>[<shortname>]"
      - "<gray>Level: <white><level>"
      - "<gray>XP: <white><xp>"
      - "<gray>Members: <white><members>"

  # ── Icon selection ─────────────────────────────────────────────
  icon-selection-pane:
    material: cyan_stained_glass_pane
    name: " "
    lore: []

  icon-selection-instruction:
    material: cyan_stained_glass_pane
    name: "<aqua>Click any item above to select it as the icon"
    lore: []
