# ─────────────────────────────────────────────────────────────────
#  GuildRoyale — guis.yml
#  Titles/lores use MiniMessage. Placeholders: <guild>, <page>, <max_page>, …
#  Items are parsed by YamlItem (ItemAPI).
#
#  Conventions:
#    - Titles: bold + <shadow:#000000FF>, soft gradient preferred
#    - Paged titles: base title + non-bold " page (current/max)" via title-paged
#    - Default size: 54 (6 rows)
#    - List nav: prev=45, action2=47, back=49, action1=51, next=53, top-action=4
#    - List fillers: border-filler / inner-filler (item keys; inner defaults to air)
#    - Item names: bold (+ soft gradient preferred)
#    - Lore: empty first/last line; each content line padded with a trailing space
# ─────────────────────────────────────────────────────────────────

hub:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>GuildRoyale</bold></gradient></shadow>"
  slots:
    info: 20
    leaderboard: 31
    create: 24
  requirements:
    separator: " <dark_gray>───────────────── "
    header: " <yellow>Requirements: "
    permission-ok: " <green>✔ <gray>Permission "
    permission-fail: " <red>✘ <gray>Permission <dark_gray>(<node>) "
    cost-ok: " <green>✔ <gray>Cost: <white><cost> "
    cost-fail: " <red>✘ <gray>Cost: <white><cost> "
    item-ok-prefix: " <green>✔ "
    item-fail-prefix: " <red>✘ "
