# ─────────────────────────────────────────────────────────────────
#  GuildRoyale — guis.yml
#  Titles/lores use MiniMessage. Placeholders: <guild>, <page>, <max_page>, …
#  Items are parsed by YamlItem (ItemAPI).
#
#  Conventions:
#    - Titles: bold + <shadow:#000000FF>, soft gradient preferred
#    - Paged titles: base title + non-bold " page (current/max)" via title-paged
#    - Default size: 54 (6 rows)
#    - List nav: prev=45, action2=47, back=49, action1=51, next=53, top-action=4
#    - Item names: bold (+ soft gradient preferred)
#    - Lore: empty first/last line; each content line padded with a trailing space
# ─────────────────────────────────────────────────────────────────

hub:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>GuildRoyale</bold></gradient></shadow>"
  slots:
    info: 20
    leaderboard: 31
    create: 24
  requirements:
    separator: " <dark_gray>───────────────── "
    header: " <yellow>Requirements: "
    permission-ok: " <green>✔ <gray>Permission "
    permission-fail: " <red>✘ <gray>Permission <dark_gray>(<node>) "
    cost-ok: " <green>✔ <gray>Cost: <white><cost> "
    cost-fail: " <red>✘ <gray>Cost: <white><cost> "
    item-ok-prefix: " <green>✔ "
    item-fail-prefix: " <red>✘ "
    none: " <gray>None: free to create! "

dialogs:
  create:
    title: "<gold><bold>Create a Guild"
    body: "<gray>Choose a <white>name</white> (3-32 chars) and a <white>shortname</white> (2-6 alphanumeric)."
    body-no-shortname: "<gray>Choose a <white>name</white> (3-32 chars)."
    name-label: "<yellow>Guild Name"
    shortname-label: "<yellow>Shortname"
    submit: "<green>Create Guild"
  shortname:
    title: "<gold>Change Shortname"
    body: "<gray>Enter a new shortname <dark_gray>(2-6 alphanumeric)."
    input-label: "<yellow>New Shortname"
    submit: "<green>Change"
  role-name:
    title: "<gold>Role Name"
    body: "<gray><prompt>"
    input-label: "<yellow>Role Name"
    submit: "<green>Confirm"

main:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Guild Menu</bold></gradient></shadow>"
  slots:
    icon: 13
    info: 20
    members: 22
    roles: 24
    leaderboard: 29
    storage: 31
    bank: 33
    settings: 40

info:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Guild Info</bold></gradient></shadow>"
  slots:
    info: 22
    back: 49
  badge-line: " <gray>Badge: <badge> "

members:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Members</bold></gradient></shadow>"
  title-paged: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Members</bold> page (<page>/<max_page>)</gradient></shadow>"
  slots:
    previous: 45
    action2: 47
    back: 49
    action1: 51
    next: 53
    top-action: 4

member-action:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Member: <player></bold></gradient></shadow>"
  slots:
    head: 13
    kick: 29
    promote: 31
    demote: 33
    back: 49

roles:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Roles</bold></gradient></shadow>"
  title-paged: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Roles</bold> page (<page>/<max_page>)</gradient></shadow>"
  slots:
    previous: 45
    action2: 47
    back: 49
    action1: 51
    create: 51
    next: 53
    top-action: 4

role-editor:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Edit Role: <role></bold></gradient></shadow>"
  slots:
    info: 4
    permissions-start: 10
    set-icon: 47
    delete: 51
    back: 49
  permission-enabled: "<green><bold>✔ <permission>"
  permission-disabled: "<red><bold>✗ <permission>"
  materials:
    permission-enabled: lime_dye
    permission-disabled: red_dye

leaderboard:
  size: 54
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Guild Leaderboard</bold></gradient></shadow>"
  title-paged: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Guild Leaderboard</bold> page (<page>/<max_page>)</gradient></shadow>"
  slots:
    previous: 45
    action2: 47
    back: 49
    action1: 51
    next: 53
    top-action: 4

settings:
  size: 54
  title: "<shadow:#000000FF><gradient:#aab7b8:#d5dbdb><bold>Guild Settings</bold></gradient></shadow>"
  slots:
    shortname: 20
    icon: 22
    disband: 24
    back: 49

storage:
  title: "<shadow:#000000FF><gradient:#f0c14b:#ffe08a><bold>Guild Storage</bold></gradient></shadow>"

icon-selection:
  size: 54
  title: "<shadow:#000000FF><gradient:#5dade2:#aed6f1><bold>Select an Icon</bold></gradient></shadow>"
  content-slots: 36
  instruction-slot: 49
  instruction-row-start: 45
  instruction-row-end: 54

items:
  # ── Hub (not in a guild) ───────────────────────────────────────
  hub-info-book:
    material: book
    name: "<gradient:#f0c14b:#ffe08a><bold>How Guilds Work</bold></gradient>"
    lore:
      - ""
      - " <gray>Guilds let you team up, share "
      - " <gray>storage & bank, earn XP, and "
      - " <gray>climb the leaderboard. "
      - ""
      - " <yellow>Getting started "
      - " <white>1. <gray>Meet the requirements "
      - " <white>2. <gray>Click <green>Create a Guild "
      - " <white>3. <gray>Pick a name & shortname "
      - " <white>4. <gray>Invite friends with "
      - "    <yellow>/guild invite <player> "
      - ""
      - " <dark_gray>Hover the create button for "
      - " <dark_gray>live requirement status. "
      - ""

  create-ready:
    material: lime_concrete
    name: "<gradient:#55c57a:#a8e6c1><bold>Create a Guild</bold></gradient>"
    lore:
      - ""
      - " <gray>You meet the requirements! "
      - " <yellow>Click <gray>to open the creation dialog. "
      - ""

  create-already-in-guild:
    material: barrier
    name: "<gradient:#e74c3c:#f1948a><bold>Already in a Guild</bold></gradient>"
    lore:
      - ""
      - " <gray>Leave or disband your current "
      - " <gray>guild before creating another. "
      - ""

  create-no-permission:
    material: red_concrete
    name: "<gradient:#e74c3c:#f1948a><bold>Cannot Create</bold></gradient>"
    lore:
      - ""
      - " <gray>You lack permission to create "
      - " <gray>a guild on this server. "
      - ""

  create-insufficient-funds:
    material: red_concrete
    name: "<gradient:#e74c3c:#f1948a><bold>Not Enough Money</bold></gradient>"
    lore:
      - ""
      - " <gray>Earn more money, then try again. "
      - ""

  create-missing-items:
    material: red_concrete
    name: "<gradient:#e74c3c:#f1948a><bold>Missing Items</bold></gradient>"
    lore:
      - ""
      - " <gray>Gather the required items, "
      - " <gray>then try again. "
      - ""

  hub-leaderboard:
    material: golden_helmet
    name: "<gradient:#f0c14b:#ffe08a><bold>Leaderboard</bold></gradient>"
    lore:
      - ""
      - " <gray>See the top guilds "
      - " <gray>on this server. "
      - ""

  # ── Main menu (in a guild) ─────────────────────────────────────
  main-info:
    material: paper
    name: "<gradient:#5dade2:#aed6f1><bold>Guild Info</bold></gradient>"
    lore:
      - ""
      - " <gray>View level, XP, members, "
      - " <gray>and other guild details. "
      - ""

  main-members:
    material: player_head
    name: "<gradient:#55c57a:#a8e6c1><bold>Members</bold></gradient>"
    lore:
      - ""
      - " <gray>View and manage members. "
      - ""

  main-roles:
    material: writable_book
    name: "<gradient:#f4d03f:#f9e79f><bold>Roles</bold></gradient>"
    lore:
      - ""
      - " <gray>Manage roles & permissions. "
      - ""

  main-leaderboard:
    material: golden_helmet
    name: "<gradient:#f0c14b:#ffe08a><bold>Leaderboard</bold></gradient>"
    lore:
      - ""
      - " <gray>Global guild rankings. "
      - ""

  main-storage:
    material: chest
    name: "<gradient:#f0c14b:#ffe08a><bold>Storage</bold></gradient>"
    lore:
      - ""
      - " <gray>Open the shared guild chest. "
      - ""

  main-bank:
    material: gold_ingot
    name: "<gradient:#f4d03f:#f9e79f><bold>Bank</bold></gradient>"
    lore:
      - ""
      - " <gray>Check balance or manage funds "
      - " <gray>via <white>/guild bank "
      - ""

  main-settings:
    material: comparator
    name: "<gradient:#aab7b8:#d5dbdb><bold>Settings</bold></gradient>"
    lore:
      - ""
      - " <gray>Change shortname, icon, "
      - " <gray>and other guild options. "
      - ""

  # ── Settings ───────────────────────────────────────────────────
  settings-shortname:
    material: name_tag
    name: "<gradient:#f4d03f:#f9e79f><bold>Shortname</bold></gradient>"
    lore:
      - ""
      - " <gray>Change the guild shortname. "
      - " <yellow>Click <gray>to open the dialog. "
      - ""

  settings-icon:
    material: item_frame
    name: "<gradient:#5dade2:#aed6f1><bold>Icon</bold></gradient>"
    lore:
      - ""
      - " <gray>Pick a new guild icon "
      - " <gray>from your inventory. "
      - ""

  settings-disband:
    material: barrier
    name: "<gradient:#e74c3c:#f1948a><bold>Disband</bold></gradient>"
    lore:
      - ""
      - " <red>Permanently delete this guild. "
      - " <dark_gray>Leaders only: use "
      - " <yellow>/guild disband "
      - ""

  # ── Shared nav ─────────────────────────────────────────────────
  gui-border-filler:
    material: black_stained_glass_pane
    name: " "
    hide-tooltip: true

  gui-inner-filler:
    material: air

  gui-filler:
    material: black_stained_glass_pane
    name: " "
    hide-tooltip: true

  gui-back:
    material: arrow
    name: "<gradient:#aab7b8:#d5dbdb><bold>Back</bold></gradient>"
    lore:
      - ""
      - " <dark_gray>Return to the previous menu. "
      - ""

  gui-previous:
    material: arrow
    name: "<gradient:#5dade2:#aed6f1><bold>« Previous Page</bold></gradient>"
    lore:
      - ""
      - " <gray>Go to the previous page. "
      - ""

  gui-next:
    material: arrow
    name: "<gradient:#5dade2:#aed6f1><bold>Next Page »</bold></gradient>"
    lore:
      - ""
      - " <gray>Go to the next page. "
      - ""

  gui-close:
    material: barrier
    name: "<gradient:#e74c3c:#f1948a><bold>Close</bold></gradient>"
    lore:
      - ""
      - " <gray>Close this menu. "
      - ""

  # ── Info ───────────────────────────────────────────────────────
  info-book:
    material: book
    name: "<gradient:#f0c14b:#ffe08a><bold><guild></bold></gradient>"
    lore:
      - ""
      - " <gray>Shortname: [<shortname>] "
      - " <gray>Level: <level> "
      - " <gray>XP: <xp> "
      - " <gray>Members: <members> "
      - " <gray>Leader: <leader> "
      - " <gray>Founded: <founded> "
      - ""

  # ── Members ────────────────────────────────────────────────────
  members-entry:
    material: player_head
    name: "<gradient:#f4d03f:#f9e79f><bold><player></bold></gradient>"
    lore:
      - ""
      - " <gray>Role: <white><role> "
      - " <gray>Contribution: <white><contribution> XP "
      - " <yellow>Click to manage "
      - ""

  # ── Member action ──────────────────────────────────────────────
  member-action-head:
    material: player_head
    name: "<gradient:#f4d03f:#f9e79f><bold><player></bold></gradient>"
    lore:
      - ""
      - " <gray>Role: <white><role> "
      - " <gray>Contribution: <white><contribution> XP "
      - ""

  member-action-kick:
    material: barrier
    name: "<gradient:#e74c3c:#f1948a><bold>Kick</bold></gradient>"
    lore:
      - ""
      - " <gray>Remove this member from the guild "
      - ""

  member-action-promote:
    material: arrow
    name: "<gradient:#55c57a:#a8e6c1><bold>Promote</bold></gradient>"
    lore:
      - ""
      - " <gray>Move to a higher role "
      - ""

  member-action-demote:
    material: arrow
    name: "<gradient:#f4d03f:#f9e79f><bold>Demote</bold></gradient>"
    lore:
      - ""
      - " <gray>Move to a lower role "
      - ""

  # ── Roles ──────────────────────────────────────────────────────
  roles-entry:
    material: name_tag
    name: "<gradient:#f0c14b:#ffe08a><bold><role></bold></gradient>"
    lore:
      - ""
      - " <gray>Index: <white><index> "
      - " <gray>Permissions: <white><permissions> "
      - " <yellow>Click to edit "
      - ""

  roles-create:
    material: lime_dye
    name: "<gradient:#55c57a:#a8e6c1><bold>+ Create New Role</bold></gradient>"
    lore:
      - ""
      - " <gray>Add a new role to this guild. "
      - ""

  # ── Role editor ────────────────────────────────────────────────
  role-editor-info:
    material: name_tag
    name: "<gradient:#f0c14b:#ffe08a><bold>Role: <role></bold></gradient>"
    lore:
      - ""
      - " <gray>Toggle permissions below. "
      - ""

  role-editor-set-icon:
    material: painting
    name: "<gradient:#5dade2:#aed6f1><bold>Set Icon</bold></gradient>"
    lore:
      - ""
      - " <gray>Hold an item and click to set as role icon "
      - ""

  role-editor-delete:
    material: barrier
    name: "<gradient:#e74c3c:#f1948a><bold>Delete Role</bold></gradient>"
    lore:
      - ""
      - " <red>Remove this role. Members will be reassigned. "
      - ""

  # ── Leaderboard ────────────────────────────────────────────────
  leaderboard-entry:
    material: golden_helmet
    name: "<gradient:#f0c14b:#ffe08a><bold>#<rank> <guild></bold></gradient>"
    lore:
      - ""
      - " <gray>[<shortname>] "
      - " <gray>Level: <white><level> "
      - " <gray>XP: <white><xp> "
      - " <gray>Members: <white><members> "
      - ""

  # ── Icon selection ─────────────────────────────────────────────
  icon-selection-pane:
    material: cyan_stained_glass_pane
    name: " "
    hide-tooltip: true

  icon-selection-instruction:
    material: cyan_stained_glass_pane
    name: "<gradient:#5dade2:#aed6f1><bold>Click an item above to select it</bold></gradient>"
    lore:
      - ""
      - " <gray>Any item from your inventory works. "
      - ""
