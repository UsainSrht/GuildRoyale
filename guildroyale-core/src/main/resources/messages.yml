# ─────────────────────────────────────────────────────────────────
#  GuildRoyale — messages.yml
#
#  Each key may be:
#    - a plain MiniMessage string  → single chat line
#    - a map with optional fields:
#        chat: string | list
#        sound: string | list (keys like entity.player.levelup)
#        actionbar: string
#        title:
#          title: string
#          subtitle: string
#          fade-in / stay / fade-out: ticks
#
#  Placeholders: <guild>, <player>, <role>, <level>, <xp>,
#                <reason>, <cost>, <page>, <total_pages>, <feature>, <badge>, <cmd>, <sub>
# ─────────────────────────────────────────────────────────────────

prefix: "<dark_gray>[<gradient:gold:yellow>GuildRoyale</gradient>]</dark_gray> "

# ── Tags ──────────────────────────────────────────────────────────
# Customisable component tags for guilds, roles, members, and players.
# Supports MiniMessage formatting, hover text, nested tags (<member_player_tag>),
# MiniPlaceholders v3 (global & audience), and custom placeholders.
tags:
  guild: "<hover:show_text:'<gradient:#f0c14b:#ffe08a><bold>Guild Information</bold></gradient><newline><gray>Level: <gold><guild_level></gold><newline><gray>Members: <gold><guild_members></gold> <dark_gray>(<green><guild_members_online> online</green>)</dark_gray><newline><gray>XP: <yellow><guild_xp></yellow><newline><gray>Leader: <gold><guild_leader></gold>'><yellow><guild_name></yellow></hover>"
  role: "<hover:show_text:'<gray>Role Rank: <gold>#<role_index></gold>'><role_color><role_name></role_color></hover>"
  member: "<hover:show_text:'<role_color><bold><member_role_name></bold></role_color><newline><gray>Contribution: <gold><member_contribution> XP</gold>'><role_color><member_player_tag></role_color></hover>"
  player: "<player_displayname>"

# ── General ──────────────────────────────────────────────────────
no-permission: "<red>You do not have permission to do that."
player-only: "<red>This command can only be used by players."
player-not-found: "<red>Player <yellow><player></yellow> was not found."
not-in-guild: "<red>You are not in a guild."
already-in-guild: "<red>You are already in a guild."
invalid-guild: "<red>That guild does not exist."
unknown-error: "<red>An unexpected error occurred. Please try again."

# ── Guild creation ────────────────────────────────────────────────
guild-created:
  chat:
    - "<green>Guild <gold><guild></gold> has been created!"
  sound:
    - entity.player.levelup
  actionbar: "<green>Welcome to <guild>!"
  title:
    title: "<gold><bold>Guild Created"
    subtitle: "<yellow><guild>"
    fade-in: 10
    stay: 50
    fade-out: 15

guild-created-broadcast: "<gold><player></gold> <yellow>has created the guild <gold><guild></gold>!"

guild-name-taken: "<red>A guild with that name already exists."
guild-name-invalid: "<red>Guild name must be 3–32 characters and contain only letters, numbers, spaces, or hyphens."
guild-shortname-invalid: "<red>Shortname must be 2–6 characters and contain only letters or numbers."
guild-shortname-taken: "<red>That shortname is already in use."
guild-creation-cost: "<yellow>Creating a guild costs <gold><cost></gold>. Opening creation dialog..."
guild-creation-insufficient-funds:
  chat: "<red>You need <gold><cost></gold> to create a guild."
  sound: entity.villager.no
guild-creation-no-permission:
  chat: "<red>You do not have permission to create a guild."
  sound: entity.villager.no
guild-creation-missing-items:
  chat: "<red>You do not have the required items to create a guild."
  sound: entity.villager.no

# ── Feature locks ─────────────────────────────────────────────────
feature-locked: "<red>Your guild must reach level <gold><level></gold> to unlock <yellow><feature></yellow>."
storage-slot-locked: "<red>This storage slot is locked! Unlocks at guild level <gold><level></gold>."

# ── Guild disband ─────────────────────────────────────────────────
guild-disbanded:
  chat: "<yellow>Your guild <gold><guild></gold> has been disbanded."
  sound: entity.item.break
guild-disbanded-broadcast: "<yellow>The guild <gold><guild></gold> has been disbanded."
guild-disband-not-leader: "<red>Only the guild leader can disband the guild."

# ── Membership ────────────────────────────────────────────────────
member-joined: "<green><player> has joined the guild!"
member-joined-self:
  chat: "<green>You have joined <gold><guild></gold>!"
  sound: entity.experience_orb.pickup
  actionbar: "<green>Joined <guild>"
member-left: "<yellow><player> has left the guild."
member-left-self: "<yellow>You have left <gold><guild></gold>."
member-kicked: "<red><player> has been kicked from the guild."
member-kicked-self:
  chat: "<red>You have been kicked from <gold><guild></gold>."
  sound: entity.elder_guardian.curse
member-not-found: "<red>That player is not a member of your guild."
cannot-kick-self: "<red>You cannot kick yourself. Use leave instead."
cannot-kick-leader: "<red>You cannot kick the guild leader."
target-outranks-you: "<red>You cannot perform this action on someone who outranks you."

# ── Invitations ───────────────────────────────────────────────────
invite-sent:
  chat: "<green>Invitation sent to <yellow><player></yellow>."
  sound: entity.experience_orb.pickup
invite-received:
  chat:
    - ""
    - "<gold><player></gold> <yellow>invited you to join <gold><guild></gold>!"
    - "<gray>Accept with <white>/guild join <guild>"
  sound: block.note_block.pling
  actionbar: "<yellow>Guild invite from <guild>"
invite-already-sent: "<red>That player already has a pending invite to your guild."
invite-expired: "<red>Your invitation has expired."
no-invite: "<red>You do not have a pending invitation from that guild."
invite-revoked: "<yellow>Invitation to <player> has been revoked."

# ── Roles ─────────────────────────────────────────────────────────
role-created: "<green>Role <gold><role></gold> has been created."
role-deleted: "<yellow>Role <gold><role></gold> has been deleted. Members reassigned."
role-renamed: "<green>Role renamed to <gold><role></gold>."
role-name-invalid: "<red>Role name must be 2–20 characters."
role-not-found: "<red>No role with that index exists."
role-changed: "<green><player>'s role has been changed to <gold><role></gold>."
role-changed-self: "<yellow>Your role has been changed to <gold><role></gold>."
role-index-invalid: "<red>Role index must be between 1 and the number of roles."
role-max-reached: "<red>Maximum number of roles reached."
role-leader-protected: "<red>The leader role cannot be modified this way."
role-color-updated: "<green>Role color set to <gold><color></gold>."
role-color-invalid: "<red>Invalid role color."
permission-toggled: "<green>Permission toggled for role <gold><role></gold>."
permission-invalid: "<red>Invalid permission."
role-usage: "<red>Usage: <yellow>/<cmd> <sub> <create|delete|rename|setpermission>"

# ── Icon ──────────────────────────────────────────────────────────
icon-updated:
  chat: "<green>Guild icon updated!"
  sound: ui.loom.select_pattern
icon-invalid: "<red>Please click with a valid item on your cursor to change the icon."

# ── Shortname ─────────────────────────────────────────────────────
shortname-changed:
  chat: "<green>Guild shortname changed to <gold>[<guild>]</gold>."
  sound: ui.cartography_table.take_result
shortname-change-cost-msg: "<yellow>Changing your shortname costs <gold><cost></gold>."
shortname-insufficient-funds: "<red>You need <gold><cost></gold> to change your shortname."

# ── Badges ────────────────────────────────────────────────────────
badge-list-header: "<gold>━━━━━ Guild Badges ━━━━━"
badge-bought:
  chat: "<green>Purchased badge <gold><badge></gold>!"
  sound: entity.player.levelup
badge-equipped:
  chat: "<green>Equipped badge <gold><badge></gold>!"
  sound: item.armor.equip_gold
badge-not-found: "<red>That badge does not exist."
badge-not-buyable: "<red>That badge cannot be purchased."
badge-not-grantable: "<red>That badge cannot be granted."
badge-already-owned: "<red>Your guild already owns that badge."
badge-not-owned: "<red>Your guild does not own that badge."
badge-insufficient-funds: "<red>You cannot afford that badge."
badge-usage: "<red>Usage: <yellow>/guild badge <list|buy|equip>"

# ── Bank ──────────────────────────────────────────────────────────
bank-balance: "<gray>Guild bank balance: <gold><cost></gold>"
bank-deposit:
  chat: "<green>Deposited <gold><cost></gold> into the guild bank."
  sound: entity.experience_orb.pickup
bank-withdraw:
  chat: "<green>Withdrew <gold><cost></gold> from the guild bank."
  sound: entity.experience_orb.pickup
bank-invalid-amount: "<red>Amount must be greater than zero."
bank-insufficient-funds: "<red>You do not have enough money."
bank-insufficient-guild-funds: "<red>The guild bank does not have enough money."
bank-transfer-failed: "<red>Bank transfer failed. Please try again."
bank-usage: "<red>Usage: <yellow>/guild bank <balance|deposit|withdraw>"

# ── Leader transfer ───────────────────────────────────────────────
leader-transferred:
  chat: "<green>Leadership of <gold><guild></gold> has been transferred to <yellow><player></yellow>."
  sound: ui.toast.challenge_complete
leader-transferred-self:
  chat: "<yellow>You are now the leader of <gold><guild></gold>."
  title:
    title: "<gold>Leadership"
    subtitle: "<yellow>You lead <guild>"
    fade-in: 10
    stay: 40
    fade-out: 10
must-be-leader: "<red>Only the guild leader can do this."

# ── GUI hints ─────────────────────────────────────────────────────
gui-settings-hint: "<gray>Use <yellow>/guild shortname</yellow> or <yellow>/guild icon</yellow> to update settings."
gui-disband-hint: "<red>To disband, run <yellow>/guild disband</yellow> as the leader."

# ── Leaderboard ───────────────────────────────────────────────────
leaderboard-header: "<gold>━━━━━ Guild Leaderboard (Page <page>/<total_pages>) ━━━━━"
leaderboard-entry: "<gray>#<level> <gold><guild></gold> — Lv.<gold><level></gold>"
leaderboard-empty: "<yellow>No guilds found."
leaderboard-invalid-page: "<red>Invalid page number."

# ── Admin ─────────────────────────────────────────────────────────
admin-reload:
  chat: "<green>GuildRoyale configuration reloaded."
  sound: entity.experience_orb.pickup
admin-addxp: "<green>Added <gold><xp></gold> XP to guild <gold><guild></gold>."
admin-setlevel: "<green>Set <gold><guild></gold>'s level to <gold><level></gold>."
admin-delete: "<green>Guild <gold><guild></gold> has been forcefully deleted."
admin-badge-grant: "<green>Granted badge <gold><badge></gold> to <gold><guild></gold>."
admin-badge-revoke: "<yellow>Revoked badge <gold><badge></gold> from <gold><guild></gold>."

# ── Help ──────────────────────────────────────────────────────────
guild-help-header: "<gold><bold>GuildRoyale</bold></gold> <dark_gray>—</dark_gray> <yellow>/<cmd> help</yellow>"
guildadmin-help-header: "<gold><bold>GuildRoyale Admin</bold></gold> <dark_gray>—</dark_gray> <yellow>/<cmd> help</yellow>"
